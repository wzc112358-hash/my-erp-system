name: Verify and Deploy

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: backend/go.sum

      - name: Verify backend
        working-directory: backend
        run: go test ./...

      - name: Verify opportunity agent
        working-directory: agent-service
        run: npm test

      - name: Build immutable release images
        if: github.event_name != 'pull_request'
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker build --label "org.opencontainers.image.revision=$REVISION" -t "my-erp-system-frontend:$REVISION" -t my-erp-system-frontend:latest ./frontend
          docker build --label "org.opencontainers.image.revision=$REVISION" -t "my-erp-system-pocketbase-beijing:$REVISION" -t my-erp-system-pocketbase-beijing:latest ./backend
          docker tag "my-erp-system-pocketbase-beijing:$REVISION" "my-erp-system-pocketbase-lanzhou:$REVISION"
          docker tag my-erp-system-pocketbase-beijing:latest my-erp-system-pocketbase-lanzhou:latest
          docker build --label "org.opencontainers.image.revision=$REVISION" -t "my-erp-system-opportunity-agent:$REVISION" -t my-erp-system-opportunity-agent:latest ./agent-service
          docker pull traefik:v3.7.13

      - name: Package release
        if: github.event_name != 'pull_request'
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker save \
            "my-erp-system-frontend:$REVISION" my-erp-system-frontend:latest \
            "my-erp-system-pocketbase-beijing:$REVISION" my-erp-system-pocketbase-beijing:latest \
            "my-erp-system-pocketbase-lanzhou:$REVISION" my-erp-system-pocketbase-lanzhou:latest \
            "my-erp-system-opportunity-agent:$REVISION" my-erp-system-opportunity-agent:latest \
            traefik:v3.7.13 | gzip -1 > images.tar.gz
          tar czf deploy-config.tar.gz \
            docker-compose.yml \
            traefik/traefik.yml \
            traefik/dynamic.toml \
            scripts/erp-backup.sh \
            scripts/deploy-release.sh
          sha256sum images.tar.gz > images.tar.gz.sha256
          sha256sum deploy-config.tar.gz > deploy-config.tar.gz.sha256

      - name: Configure verified SSH host
        if: github.event_name != 'pull_request'
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts" "$RUNNER_TEMP/ssh/deploy_key"

      - name: Upload release
        if: github.event_name != 'pull_request'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          release_dir="/root/my-erp-system/releases/${GITHUB_SHA}"
          ssh -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/deploy_key" "$SERVER_USER@$SERVER_HOST" "install -d -m 700 '$release_dir'"
          scp -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/deploy_key" \
            images.tar.gz images.tar.gz.sha256 \
            deploy-config.tar.gz deploy-config.tar.gz.sha256 \
            scripts/deploy-release.sh \
            "$SERVER_USER@$SERVER_HOST:$release_dir/"

      - name: Deploy release
        if: github.event_name != 'pull_request'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          release_dir="/root/my-erp-system/releases/${GITHUB_SHA}"
          ssh -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/deploy_key" \
            "$SERVER_USER@$SERVER_HOST" \
            "bash '$release_dir/deploy-release.sh' '$release_dir' '$GITHUB_SHA'"

      - name: Remove runner SSH key
        if: always() && github.event_name != 'pull_request'
        run: rm -f "$RUNNER_TEMP/ssh/deploy_key"
