<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; connect-src http://127.0.0.1:* http://localhost:*" />
  <title>恒化成招投标采集助手</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #eef2f3;
      --surface: #ffffff;
      --surface-subtle: #f5f7f7;
      --surface-strong: #e8eeed;
      --ink: #14211f;
      --ink-soft: #50615e;
      --ink-faint: #71817e;
      --line: #d5dedc;
      --line-strong: #aebdb9;
      --accent: #176b5b;
      --accent-hover: #105548;
      --accent-soft: #e1f0ec;
      --success: #176b45;
      --success-soft: #e2f2e9;
      --warning: #8a5a08;
      --warning-soft: #fff2d4;
      --danger: #a33129;
      --danger-soft: #f9e6e4;
      --focus: #67a99c;
      --radius: 12px;
      --control-radius: 8px;
      --z-sticky: 20;
      --z-toast: 40;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.55;
    }
    button, input, select { font: inherit; }
    button, a, input, select, summary { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 42%, transparent);
      outline-offset: 2px;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      min-height: 100dvh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100dvh;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: var(--surface);
    }
    .sidebar-inner { padding: 22px 20px 28px; }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 20px;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      border-radius: var(--control-radius);
      background: var(--accent);
      color: #fff;
      font-size: 18px;
      font-weight: 800;
    }
    .brand strong { display: block; font-size: 15px; line-height: 1.3; }
    .brand span { color: var(--ink-soft); font-size: 12px; }

    .nav-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      border-radius: var(--control-radius);
      background: var(--surface-strong);
    }
    .nav-tab {
      min-height: 36px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--ink-soft);
      cursor: pointer;
      font-weight: 700;
      transition: background 180ms cubic-bezier(.16, 1, .3, 1), color 180ms cubic-bezier(.16, 1, .3, 1);
    }
    .nav-tab:hover { color: var(--ink); }
    .nav-tab[aria-selected="true"] { background: var(--surface); color: var(--accent); }

    .sidebar-panel { display: none; margin-top: 18px; }
    .sidebar-panel.active { display: block; }
    .section-title { margin: 0 0 4px; font-size: 14px; }
    .section-help { margin: 0 0 12px; color: var(--ink-soft); font-size: 12px; }

    .site-launcher {
      display: grid;
      gap: 9px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }
    label { display: grid; gap: 5px; color: var(--ink-soft); font-size: 12px; font-weight: 700; }
    input, select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line-strong);
      border-radius: var(--control-radius);
      background: var(--surface);
      color: var(--ink);
      padding: 0 11px;
    }
    input::placeholder { color: #697976; opacity: 1; }
    input:hover, select:hover { border-color: #829590; }
    input:focus, select:focus { border-color: var(--accent); outline: 3px solid color-mix(in srgb, var(--focus) 30%, transparent); }

    button {
      min-height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: var(--control-radius);
      background: var(--surface);
      color: var(--ink);
      padding: 0 14px;
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
      transition: background 180ms cubic-bezier(.16, 1, .3, 1), border-color 180ms cubic-bezier(.16, 1, .3, 1), transform 120ms ease;
    }
    button:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { cursor: not-allowed; opacity: .5; }
    button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    button.primary:hover:not(:disabled) { border-color: var(--accent-hover); background: var(--accent-hover); }
    button.quiet { border-color: transparent; background: transparent; color: var(--accent); }

    .task-history { margin-top: 18px; }
    .task-list { display: grid; gap: 6px; margin-top: 9px; }
    .task-entry {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 4px;
      align-items: center;
    }
    .task-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 3px 10px;
      width: 100%;
      min-height: 62px;
      padding: 10px 11px;
      text-align: left;
      border-color: transparent;
      background: transparent;
      font-weight: 400;
      white-space: normal;
    }
    .task-row:hover:not(:disabled) { border-color: var(--line); background: var(--surface-subtle); }
    .task-row.selected { border-color: var(--line-strong); background: var(--surface-subtle); }
    .task-row strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .task-row small { grid-column: 1 / -1; color: var(--ink-faint); font-size: 11px; }
    .task-delete {
      min-height: 34px;
      padding: 0 8px;
      border-color: transparent;
      background: transparent;
      color: var(--ink-faint);
      font-size: 12px;
    }
    .task-delete:hover:not(:disabled) { border-color: transparent; background: var(--danger-soft); color: var(--danger); }

    .settings-form { display: grid; gap: 11px; }
    .settings-group { display: grid; gap: 11px; padding-top: 18px; margin-top: 18px; border-top: 1px solid var(--line); }
    #baiduOCRFields, #paddleOCRFields { display: grid; gap: 11px; }
    .settings-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .settings-state {
      min-height: 38px;
      padding: 9px 10px;
      border-radius: var(--control-radius);
      background: var(--surface-subtle);
      color: var(--ink-soft);
      font-size: 12px;
    }
    .settings-state.ok { background: var(--success-soft); color: var(--success); }
    .settings-state.bad { background: var(--danger-soft); color: var(--danger); }
    .settings-state.testing { background: var(--warning-soft); color: var(--warning); }

    .sidebar-footer {
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--ink-faint);
      font-size: 11px;
    }

    main { min-width: 0; padding: 30px clamp(22px, 4vw, 56px) 52px; }
    .workspace { width: min(100%, 980px); margin: 0 auto; }
    .toast {
      position: sticky;
      top: 14px;
      z-index: var(--z-toast);
      display: none;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: var(--control-radius);
      background: var(--success-soft);
      color: var(--success);
      font-weight: 700;
    }
    .toast.show { display: block; }
    .toast.bad { background: var(--danger-soft); color: var(--danger); }

    .empty-state {
      display: grid;
      align-content: center;
      min-height: calc(100dvh - 82px);
      max-width: 560px;
    }
    .empty-state h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: -.02em; }
    .empty-state p { max-width: 50ch; margin: 0; color: var(--ink-soft); }

    .workspace-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }
    .workspace-head h1 { margin: 0 0 5px; font-size: 24px; letter-spacing: -.02em; text-wrap: balance; }
    .workspace-head p { margin: 0; color: var(--ink-soft); }
    .status {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--surface-strong);
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .status.running { background: #e2edf7; color: #245a82; }
    .status.waiting_agent, .status.request_human { background: var(--warning-soft); color: var(--warning); }
    .status.completed { background: var(--success-soft); color: var(--success); }
    .status.failed, .status.cancelled { background: var(--danger-soft); color: var(--danger); }

    .primary-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 24px; }
    .human-callout {
      margin-bottom: 22px;
      padding: 14px 16px;
      border-radius: var(--radius);
      background: var(--warning-soft);
      color: #684405;
    }
    .human-callout strong { display: block; margin-bottom: 3px; color: var(--warning); }

    .result-panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .result-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }
    .result-head h2 { margin: 0 0 3px; font-size: 17px; }
    .result-head p { margin: 0; color: var(--ink-soft); font-size: 12px; }
    .result-count { color: var(--accent); font-size: 22px; font-weight: 800; }
    .summary {
      margin: 0;
      padding: 20px;
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .result-items { margin: 0; padding: 0 20px 20px; list-style: none; }
    .result-item { padding: 15px 0; border-top: 1px solid var(--line); }
    .result-item strong { display: block; margin-bottom: 5px; font-size: 14px; }
    .result-meta { color: var(--ink-soft); font-size: 12px; }
    .result-item a { display: inline-block; margin-top: 7px; color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }

    .run-details {
      margin-top: 18px;
      border-top: 1px solid var(--line);
    }
    .run-details summary {
      padding: 14px 2px;
      color: var(--ink-soft);
      cursor: pointer;
      font-weight: 700;
    }
    .run-details summary:hover { color: var(--accent); }
    .technical-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding-top: 4px;
    }
    .technical-block { min-width: 0; padding: 13px; border-radius: var(--control-radius); background: var(--surface-subtle); }
    .technical-block.wide { grid-column: 1 / -1; }
    .technical-block strong { display: block; margin-bottom: 5px; font-size: 12px; }
    .technical-block pre { max-height: 220px; overflow: auto; margin: 0; color: var(--ink-soft); font: 12px/1.55 "Cascadia Mono", Consolas, monospace; white-space: pre-wrap; word-break: break-word; }

    @media (max-width: 820px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .sidebar-inner { padding: 18px 16px; }
      main { padding: 22px 16px 40px; }
      .empty-state { min-height: 360px; }
      .technical-grid { grid-template-columns: 1fr; }
      .technical-block.wide { grid-column: auto; }
    }
    @media (max-width: 520px) {
      .workspace-head { display: grid; gap: 10px; }
      .primary-actions { display: grid; }
      .primary-actions button { width: 100%; }
      .result-head { padding: 15px 16px; }
      .summary { padding: 16px; }
      .result-items { padding: 0 16px 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-inner">
        <header class="brand">
          <div class="brand-mark" aria-hidden="true">恒</div>
          <div>
            <strong>招投标采集助手</strong>
            <span>恒化成</span>
          </div>
        </header>

        <div class="nav-tabs" role="tablist" aria-label="功能切换">
          <button class="nav-tab" id="tasksTab" type="button" role="tab" aria-selected="true" data-panel="tasks">采集</button>
          <button class="nav-tab" id="modelTab" type="button" role="tab" aria-selected="false" data-panel="model">智能能力</button>
        </div>

        <section class="sidebar-panel active" id="tasksPanel" role="tabpanel" aria-labelledby="tasksTab">
          <form class="site-launcher" id="siteLauncher">
            <label for="siteSelect">选择负责站点</label>
            <select id="siteSelect" required></select>
            <button class="primary" type="submit" id="launchButton">开始巡检</button>
          </form>

          <div class="task-history">
            <h2 class="section-title">最近巡检</h2>
            <p class="section-help">选择记录查看结果或继续人工验证</p>
            <div class="task-list" id="taskList"></div>
          </div>
        </section>

        <section class="sidebar-panel" id="modelPanel" role="tabpanel" aria-labelledby="modelTab">
          <h2 class="section-title">筛选模型</h2>
          <p class="section-help">用于搜索规划、相关性判断和总结</p>
          <form class="settings-form" id="llmSettingsForm">
            <label for="llmBaseUrl">接口地址
              <input id="llmBaseUrl" inputmode="url" placeholder="https://api.deepseek.com" />
            </label>
            <label for="llmModel">模型
              <input id="llmModel" placeholder="deepseek-v4-pro" />
            </label>
            <label for="llmApiKey">API Key
              <input id="llmApiKey" type="password" autocomplete="off" placeholder="已保存时可留空" />
            </label>
            <div class="settings-actions">
              <button class="primary" type="submit">保存</button>
              <button type="button" id="testLLM">测试连接</button>
            </div>
            <div class="settings-state" id="llmState">读取模型配置中</div>
          </form>

          <div class="settings-group">
            <h2 class="section-title">文档 OCR</h2>
            <form class="settings-form" id="ocrSettingsForm">
              <label for="ocrProvider">识别服务
                <select id="ocrProvider">
                  <option value="baidu">百度 OCR</option>
                  <option value="paddle">本机 PaddleOCR</option>
                  <option value="disabled">关闭</option>
                </select>
              </label>
              <div id="baiduOCRFields">
                <label for="baiduApiKey">API Key
                  <input id="baiduApiKey" type="password" autocomplete="off" placeholder="已保存时可留空" />
                </label>
                <label for="baiduSecretKey">Secret Key
                  <input id="baiduSecretKey" type="password" autocomplete="off" placeholder="已保存时可留空" />
                </label>
              </div>
              <div id="paddleOCRFields" hidden>
                <label for="paddleCommand">命令路径
                  <input id="paddleCommand" placeholder="paddleocr" />
                </label>
                <label for="paddleConfigPath">Pipeline 配置
                  <input id="paddleConfigPath" placeholder="ocr_lite.yaml" />
                </label>
                <label for="paddleDevice">设备
                  <input id="paddleDevice" placeholder="cpu" />
                </label>
              </div>
              <div class="settings-actions">
                <button class="primary" type="submit">保存</button>
                <button type="button" id="testOCR">测试连接</button>
              </div>
              <div class="settings-state" id="ocrState">读取 OCR 配置中</div>
            </form>
          </div>
        </section>

        <footer class="sidebar-footer" id="connectionState">正在连接本地服务</footer>
      </div>
    </aside>

    <main>
      <div class="workspace">
        <div class="toast" id="notice" role="status" aria-live="polite"></div>
        <div id="detail" class="empty-state">
          <h1>从左侧开始一次巡检</h1>
          <p>选择负责站点，系统会自动查询、读取相关详情，并只保留值得关注的信息。</p>
        </div>
      </div>
    </main>
  </div>
  <script src="./tasks-minimal.js"></script>
</body>
</html>
