services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`erp.henghuacheng.cn`)"
      - "traefik.http.routers.frontend.entryPoints=websecure"
      - "traefik.http.routers.frontend.tls.certResolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  pocketbase-beijing:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-pocketbase-beijing
    command: ["./pocketbase", "serve", "--http=0.0.0.0:8090", "--dir=/pb_data_beijing"]
    volumes:
      - /root/my-erp-system/backend/pb_data_beijing:/pb_data_beijing
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.beijing-api.rule=Host(`api-beijing.henghuacheng.cn`)"
      - "traefik.http.routers.beijing-api.entryPoints=websecure"
      - "traefik.http.routers.beijing-api.tls.certResolver=letsencrypt"
      - "traefik.http.services.beijing-pocketbase.loadbalancer.server.port=8090"

  pocketbase-lanzhou:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-pocketbase-lanzhou
    command: ["./pocketbase", "serve", "--http=0.0.0.0:8090", "--dir=/pb_data_lanzhou"]
    volumes:
      - /root/my-erp-system/backend/pb_data_lanzhou:/pb_data_lanzhou
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 800M
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lanzhou-api.rule=Host(`api-lanzhou.henghuacheng.cn`)"
      - "traefik.http.routers.lanzhou-api.entryPoints=websecure"
      - "traefik.http.routers.lanzhou-api.tls.certResolver=letsencrypt"
      - "traefik.http.services.lanzhou-pocketbase.loadbalancer.server.port=8090"

  opportunity-agent:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    container_name: erp-opportunity-agent
    restart: unless-stopped
    environment:
      - POCKETBASE_URL=${POCKETBASE_URL}
      - POCKETBASE_SUPERUSER_EMAIL=${POCKETBASE_SUPERUSER_EMAIL}
      - POCKETBASE_SUPERUSER_PASSWORD=${POCKETBASE_SUPERUSER_PASSWORD}
      - LOCAL_HELPER_API_PORT=8097
      - LOCAL_HELPER_PAIR_CODE=${LOCAL_HELPER_PAIR_CODE}
      - LOCAL_HELPER_API_TOKEN=${LOCAL_HELPER_API_TOKEN}
      - LOCAL_HELPER_LATEST_VERSION=${LOCAL_HELPER_LATEST_VERSION:-0.1.18}
      - ERP_BEIJING_API_URL=${ERP_BEIJING_API_URL:-https://api-beijing.henghuacheng.cn}
      - ERP_LANZHOU_API_URL=${ERP_LANZHOU_API_URL:-https://api-lanzhou.henghuacheng.cn}
      - POCKETBASE_LANZHOU_URL=${POCKETBASE_LANZHOU_URL:-http://pocketbase-lanzhou:8090}
      - HCZ_LOCAL_AGENT_LLM_BASE_URL=${HCZ_LOCAL_AGENT_LLM_BASE_URL:-https://api.deepseek.com}
      - HCZ_LOCAL_AGENT_LLM_API_KEY=${HCZ_LOCAL_AGENT_LLM_API_KEY}
      - HCZ_LOCAL_AGENT_LLM_MODEL=${HCZ_LOCAL_AGENT_LLM_MODEL:-deepseek-v4-pro}
      - HCZ_LOCAL_AGENT_LLM_TIMEOUT_MS=${HCZ_LOCAL_AGENT_LLM_TIMEOUT_MS:-90000}
      - BAIDU_OCR_API_KEY=${BAIDU_OCR_API_KEY}
      - BAIDU_OCR_SECRET_KEY=${BAIDU_OCR_SECRET_KEY}
      - BAIDU_OCR_PDF_PAGES=${BAIDU_OCR_PDF_PAGES:-6}
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - web
      - agent-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.local-helper-agent.rule=Host(`agent.henghuacheng.cn`)"
      - "traefik.http.routers.local-helper-agent.entryPoints=websecure"
      - "traefik.http.routers.local-helper-agent.tls.certResolver=letsencrypt"
      - "traefik.http.services.local-helper-agent.loadbalancer.server.port=8097"

  traefik:
    image: traefik:v2.9
    container_name: erp-traefik
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik:/etc/traefik
    networks:
      - web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  web:
    driver: bridge
  agent-internal:
    driver: bridge
